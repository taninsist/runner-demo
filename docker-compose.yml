version: '3.8'

services:
  nestjs:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - node:20
    container_name: nestjs-app
    env_file:
      - .env.test
    ports:
      - "${PORT}:${PORT}"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"  # 添加 HTTPS 端口
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /certs:/certs  # 映射 SSL 证书目录
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - nestjs

networks:
  app-network:
    driver: bridge